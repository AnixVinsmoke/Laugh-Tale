<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart | Fashion Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <a class="logo" href="index.html">Fashion<span>Store</span></a>
  <nav>
    <a href="index.html">Home</a><a href="shirts.html">Shop</a>
    <a href="cart.html" class="active cart-link">🛒 Cart <span id="cart-count">0</span></a>
  </nav>
</header>

<main class="section cart-page">
  <div class="shop-title"><p class="eyebrow">YOUR BAG</p><h1>Shopping Cart</h1></div>
  <div id="cart-empty" class="empty-state hidden">
    <h2>Your cart is empty.</h2><p>Add something you love.</p><a href="shirts.html" class="primary-btn">Continue Shopping</a>
  </div>
  <div id="cart-layout" class="cart-layout">
    <div id="cart-items" class="cart-items"></div>
    <aside class="cart-summary">
      <h2>Order Summary</h2>
      <div><span>Subtotal</span><strong id="subtotal">₹0</strong></div>
      <div><span>Delivery</span><strong id="delivery">₹50</strong></div>
      <hr>
      <div class="summary-total"><span>Total</span><strong id="total-price">₹50</strong></div>
      <button id="checkout-btn" class="checkout-btn">Proceed to Checkout →</button>
    </aside>
  </div>
</main>
<footer><p>© 2026 Fashion Store. All Rights Reserved.</p></footer>
<div id="toast" class="toast"></div>
<script src="cart.js"></script>
</body>
</html>
